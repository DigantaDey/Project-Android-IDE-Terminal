<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Forge — a professional, offline-first IDE engineered for Android phones, tablets and foldables." />
    <title>Forge — Android IDE</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0e14; height: 100%; overscroll-behavior: none; }
      #root { height: 100%; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #0b0e14; color: #8b93a7; font-family: 'Segoe UI', system-ui, sans-serif; z-index: 9999; transition: opacity .4s; }
      #boot .logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg,#4f7cff,#9d5cff); display:flex; align-items:center; justify-content:center; font-size: 28px; color: #fff; box-shadow: 0 8px 30px rgba(79,124,255,.35); }
      #boot .bar { width: 140px; height: 3px; border-radius: 2px; background: #1c2230; overflow: hidden; }
      #boot .bar::after { content:''; display:block; width: 40%; height: 100%; background: #4f7cff; border-radius: 2px; animation: boot 1.1s infinite ease-in-out; }
      @keyframes boot { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="logo">⌘</div><div style="font-weight:600;letter-spacing:.4px">Forge IDE</div><div class="bar"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
