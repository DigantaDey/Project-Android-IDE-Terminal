name: Android IDE CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      visual_report:
        description: Emit a compact native screenshot in check annotations for restricted QA environments
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Core tests, Android build & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/format/package-lock.json
      - name: Verify Java source formatting
        run: |
          npm ci --prefix tools/format --ignore-scripts --no-audit --no-fund
          npm --prefix tools/format run check
      - name: Compile, test and lint
        run: |
          set -o pipefail
          ./gradlew test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace 2>&1 | tee gradle-ci.log
      - name: Record runtime dependencies
        if: success()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/runtime-dependencies.txt
      - name: Annotate build failure
        if: failure()
        run: python3 scripts/ci-diagnostics.py gradle-ci.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core/*/build/reports/tests/
            app/build/reports/
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: forge-ide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
  device:
    needs: build
    name: Device integration (API 29)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/device-tests.sh
      - name: Optional visual QA transport
        if: always() && (github.event.inputs.visual_report == 'true' || contains(github.event.head_commit.message, '[visual-qa]'))
        run: python3 scripts/screenshot-diagnostics.py app/build/reports/device-screenshots
      - name: Annotate device failures
        if: failure()
        run: python3 scripts/ci-diagnostics.py device-ci.log app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/device-screenshots/
            app/build/reports/device-logcat.txt
