name: Android IDE CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      visual_report:
        description: Emit a compact native screenshot in check annotations for restricted QA environments
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Core tests, Android build & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/format/package-lock.json
      - name: Verify Java source formatting
        run: |
          npm ci --prefix tools/format --ignore-scripts --no-audit --no-fund
          npm --prefix tools/format run check
      - name: Test CI report helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build pinned offline native payloads (build-time downloads only)
        run: python3 scripts/native-bundle.py build
      - name: Compile, test and lint
        run: |
          set -o pipefail
          ./gradlew test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :native-runtime:assembleDebug :native-runtime:lintDebug :terminal-ui:lintDebug --stacktrace 2>&1 | tee gradle-ci.log
      - name: Assemble the offline two-APK bundle
        run: |
          mkdir -p build/offline
          cp app/build/outputs/apk/debug/app-debug.apk build/offline/forge-ide.apk
          cp native-runtime/build/outputs/apk/debug/native-runtime-debug.apk build/offline/forge-native-runtime.apk
          cp docs/NATIVE_RUNTIME.md build/offline/INSTALL-AND-SECURITY.md
          cp tools/native/runtime-lock.json build/offline/native-package-lock.json
          cp build/native/assets/runtime-catalog.json build/offline/runtime-catalog.json
          (cd build/offline && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: forge-ide-offline-bundle
          path: build/offline/
          compression-level: 0
      - name: Record runtime dependencies
        if: success()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/runtime-dependencies.txt
      - name: Annotate build failure
        if: failure()
        run: python3 scripts/ci-diagnostics.py gradle-ci.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core/*/build/reports/tests/
            app/build/reports/
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: forge-ide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: forge-ide-instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
  device:
    needs: build
    name: Device integration (API ${{ matrix.api }}, ${{ matrix.form }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            profile: pixel_2
            form: phone
          - api: 29
            profile: pixel_2
            form: phone
          - api: 35
            profile: pixel_c
            form: tablet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: forge-ide-debug-apk
          path: app/build/outputs/apk/debug
      - uses: actions/download-artifact@v8.0.2
        with:
          name: forge-ide-instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug
      - uses: actions/download-artifact@v8.0.2
        with:
          name: forge-ide-offline-bundle
          path: build/offline
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FORGE_PREBUILT_APKS: 'true'
          FORGE_VISUAL_REPORT: ${{ github.event.inputs.visual_report == 'true' || contains(github.event.head_commit.message, '[visual-qa]') }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash scripts/device-tests.sh
      - name: Optional visual QA transport
        if: always() && (github.event.inputs.visual_report == 'true' || contains(github.event.head_commit.message, '[visual-qa]'))
        run: python3 scripts/screenshot-diagnostics.py app/build/reports/device-screenshots
      - name: Annotate device failures
        if: failure()
        run: python3 scripts/ci-diagnostics.py device-ci.log app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}-${{ matrix.form }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/device-screenshots/
            app/build/reports/device-logcat.txt
            app/build/reports/device-visual.log
